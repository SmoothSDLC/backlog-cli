name: Export published package to public release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published stable version to attach to its existing release
        required: true
        default: '1.0.1'
permissions:
  contents: write
  packages: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@smoothsdlc'
      - name: Download and verify the published registry artifact
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e 'if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(process.env.PACKAGE_VERSION)) process.exit(1)'
          npm view "@smoothsdlc/smooth-backlog-cli@$PACKAGE_VERSION" dist.integrity --json --registry=https://npm.pkg.github.com > "$RUNNER_TEMP/expected-integrity.json"
          npm pack "@smoothsdlc/smooth-backlog-cli@$PACKAGE_VERSION" --json --ignore-scripts --registry=https://npm.pkg.github.com --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/package-result.json"
          node <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const [pkg] = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/package-result.json'));
          assert.equal(pkg.name, '@smoothsdlc/smooth-backlog-cli');
          assert.equal(pkg.version, process.env.PACKAGE_VERSION);
          const file = process.env.RUNNER_TEMP + '/' + pkg.filename;
          const expected = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/expected-integrity.json'));
          const actual = 'sha512-' + crypto.createHash('sha512').update(fs.readFileSync(file)).digest('base64');
          assert.equal(actual, expected, 'Downloaded tarball must match the published registry integrity');
          fs.appendFileSync(process.env.GITHUB_ENV, `PACKAGE_FILE=${file}\n`);
          console.log(JSON.stringify({name: pkg.name, version: pkg.version, integrity: actual}));
          JS
      - name: Attach the registry tarball to its public GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: gh release upload "v$PACKAGE_VERSION" "$PACKAGE_FILE" --repo "$GITHUB_REPOSITORY"
